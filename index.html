    ["rt2", "Roundtable II", '<rect x="14" y="10" width="12" height="36" rx="3"/><rect x="3" y="10" width="8" height="8" rx="2"/><rect x="29" y="10" width="8" height="8" rx="2"/><rect x="3" y="20" width="8" height="8" rx="2"/><rect x="29" y="20" width="8" height="8" rx="2"/><rect x="3" y="30" width="8" height="8" rx="2"/><rect x="29" y="30" width="8" height="8" rx="2"/><rect x="3" y="40" width="8" height="8" rx="2"/><rect x="29" y="40" width="8" height="8" rx="2"/>'],
  ];
  const GIFT_STEPS = [100, 500, 1000, 2000, 5000];
  LS.seatsPanel = (...a) => seatsPanel(...a);

  function seatsPanel(box, streamId, roomName, hooks) {
    hooks = hooks || {};
    box.classList.remove("hidden");
    let open = 0, want = 0, rows = [], coins = {}, stopped = false, ch = null, poll = null, view = "main", typing = false;
    let cfg = { layout: "panel", allow: "everyone", auto: "off", cam: true, min: 2000 }, lastAuto = "everyone";
    const kick = (uid) => sb.functions.invoke("livekit-token", { body: { roomName, action: "kick", identity: uid } }).catch(() => {});
    const say = (t) => { const e = $("#spmsg", box); if (e) e.textContent = t || ""; };
    const sorted = () => rows.filter((r) => r.status === "pending").sort((x, y) => ((coins[y.user_id] || 0) >= cfg.min ? 1 : 0) - ((coins[x.user_id] || 0) >= cfg.min ? 1 : 0) || (coins[y.user_id] || 0) - (coins[x.user_id] || 0) || x.id - y.id);

    function mainHtml() {
      const pend = sorted(), acc = rows.filter((r) => r.status === "accepted");
      return `<div class="sp-top"><b>Seats</b><button class="sp-gear" id="spgear" type="button">⚙️ Settings</button></div>
        <div class="sp-row"><span class="sp-lbl">Number of seats</span><select id="spn">${[1, 2, 3, 4, 5, 6, 7, 8].map((n) => `<option value="${n}" ${n === (open || want || 1) ? "selected" : ""}>${n}</option>`).join("")}</select><button class="btn" id="spgo">${open > 0 ? "Close seats" : "Open seats"}</button></div>
        <div class="sp-msg" id="spmsg"></div>` + (open > 0 ? `
        <div class="sp-h">Requests (${pend.length})</div>` + (pend.length ? pend.map((r) => `<div class="sp-item"><span>${esc(names[r.user_id] || "user")}${(coins[r.user_id] || 0) > 0 ? ` <em class="sp-coin${(coins[r.user_id] || 0) >= cfg.min ? " vip" : ""}">🎁 ${(coins[r.user_id] || 0).toLocaleString()}</em>` : ""}</span><button class="btn" data-act="acc" data-id="${r.id}">Accept</button><button class="btn ghost" data-act="dec" data-id="${r.id}">Decline</button></div>`).join("") : `<div class="sp-none">No requests yet.</div>`) + `
        <div class="sp-h">On stage (${acc.length}/${open})</div>` + (acc.length ? acc.map((r) => `<div class="sp-item"><span>${esc(names[r.user_id] || "user")}</span><button class="btn ghost" data-act="rem" data-id="${r.id}" data-uid="${r.user_id}">Remove</button></div>`).join("") : `<div class="sp-none">Nobody yet.</div>`) : "");
    }
    function layoutBtn(k, t, svg) {
      const on = cfg.layout === k;
      return `<button type="button" class="st-lay ${on ? "on" : ""}" data-lay="${k}"><svg viewBox="0 0 40 56" width="62" height="86" fill="#4a4a4f">${svg}</svg>${on ? `<em class="st-chip">👥 ${open || want || 1} ›</em>` : `<span>${t}</span>`}</button>`;
    }
    function settingsHtml() {
      const opt = (v, cur, t) => `<option value="${v}" ${String(v) === String(cur) ? "selected" : ""}>${t}</option>`;
      if (view === "layouts") {
        return `<div class="st-head"><button id="stback2" type="button" aria-label="Back">‹</button><b>Layout</b><span></span></div>
          <div class="st-grid">${LAYOUTS.map(([k, t, svg]) => layoutBtn(k, t, svg).replace('class="st-lay', 'class="st-lay big')).join("")}</div>`;
      }
      const autoOn = cfg.auto !== "off";
      const radio = (v, t) => `<button type="button" class="st-radio" data-auto="${v}"><span>${t}</span><i class="${cfg.auto === v ? "on" : ""}"></i></button>`;
      return `<div class="st-head"><button id="stback" type="button" aria-label="Back">‹</button><b>Multi-guest settings</b><span></span></div>
        <div class="st-line"><b>Layout</b><button type="button" id="stall" class="st-link">Show all</button></div>
        <div class="st-layouts">${LAYOUTS.map(([k, t, svg]) => layoutBtn(k, t, svg)).join("")}</div>
        <div class="st-autohead"><div><b>Auto-accept requests</b><small>This setting applies to all LIVE streams.</small></div><label class="tl-sw"><input type="checkbox" data-k="autoon" ${autoOn ? "checked" : ""}><i></i></label></div>
        ${autoOn ? `<div class="st-radios">${radio("everyone", "Everyone")}${radio("followers", "Followers")}${radio("friends", "Friends")}${radio("gifters", "Gifters")}</div>` : ""}
        <div class="st-sec">Permissions</div>
        <div class="st-card">
          <label class="st-row"><span>Allow guest requests</span><select data-k="allow">${opt("everyone", cfg.allow, "Everyone")}${opt("gifters", cfg.allow, "Gifters only")}</select></label>
          <label class="st-row"><span>Guest cameras<small>Turn off to let guests join with sound only.</small></span><select data-k="cam">${opt("1", cfg.cam ? "1" : "0", "On")}${opt("0", cfg.cam ? "1" : "0", "Off")}</select></label>
        </div>
        <div class="st-sec">Rewards</div>
        <div class="st-card"><label class="st-row"><span>Prioritize requests from gifters<small>Viewers who sent this many coins in this live appear first on the request list.</small></span><select data-k="min">${GIFT_STEPS.map((n) => opt(n, cfg.min, n.toLocaleString() + " Coins")).join("")}</select></label></div>
        <div class="sp-msg" id="spmsg"></div>`;
    }
    function render() {
      if (stopped) return;
      if (hooks.gt) hooks.gt.setCount(open, hooks.onSlotTap, guestMenu);
      const pend = sorted();
      if (hooks.onRequests) hooks.onRequests(pend.length, open);
      if (hooks.onPending) hooks.onPending(pend.map((r) => ({ id: r.id, uid: r.user_id, name: names[r.user_id] || "user", coins: coins[r.user_id] || 0 })), open);
      if (hooks.onCfg) hooks.onCfg(cfg);
      if (typing) return; // do not redraw while a menu is open
      const sheet = box.closest(".seat-sheet");
      if (sheet) sheet.classList.toggle("sdark", view !== "main");
      box.innerHTML = view === "main" ? mainHtml() : settingsHtml();
    }
    async function refresh() {
      if (stopped) return;
      try {
        const { data: st } = await sb.from("streams").select("seat_count,seat_layout,seat_allow,seat_auto,seat_cam,seat_gifter_min").eq("id", streamId).maybeSingle();
        if (st) {
          open = st.seat_count || 0;
          cfg = { layout: st.seat_layout || "panel", allow: st.seat_allow || "everyone", auto: st.seat_auto || "off", cam: st.seat_cam !== false, min: st.seat_gifter_min || 2000 };
        }
        const { data } = await sb.from("seat_requests").select("id,user_id,status").eq("stream_id", streamId).in("status", ["pending", "accepted"]).order("id", { ascending: true });
        rows = data || [];
        try {
          const { data: sl } = await sb.rpc("seat_slots", { p_stream: streamId });
          const m = {}; (sl || []).forEach((x) => { m[x.user_id] = x.slot; });
          if (hooks.gt) hooks.gt.setSlots(m);
        } catch (e) { /* ignore */ }
        try {
          const { data: gt } = await sb.rpc("gift_totals", { p_stream: streamId });
          coins = {}; (gt || []).forEach((g) => { coins[g.user_id] = Number(g.coins) || 0; });
        } catch (e) { /* ignore */ }
        await ensureNames(rows.map((r) => r.user_id));
      } catch (e) { /* ignore */ }
      render();
    }
    async function act(kind, id, uid) {
      try {
        const status = { acc: "accepted", dec: "declined", rem: "removed" }[kind];
        const { error } = await sb.rpc("host_seat_action", { p_id: +id, p_status: status });
        if (error) throw error;
        if (kind === "rem") kick(uid);
      } catch (err) {
        say(/seats_full/.test((err && err.message) || "") ? "All seats are full. Remove someone first." : "Could not do that. Try again.");
      }
      refresh();
    }
    if (hooks.api) hooks.api.act = act;

    /* tap a guest box: switch seat, mute, hide camera, remove, block */
    let menu = null;
    function closeMenu() { if (menu) { menu.remove(); menu = null; } }
    function guestMenu(uid, slot) {
      closeMenu();
      const row = rows.find((r) => r.user_id === uid && r.status === "accepted");
      menu = document.createElement("div");
      menu.className = "gmenu-bg";
      const seatsOpt = Array.from({ length: Math.max(open, 1) }, (_, i) => `<option value="${i}" ${i === slot ? "selected" : ""}>Seat ${i + 1}</option>`).join("");
      menu.innerHTML = `<div class="gmenu"><div class="gm-h"><b>${esc(names[uid] || "Guest")}</b><button type="button" data-g="x" aria-label="Close">✕</button></div>
        <label class="gm-row"><span>🔀 Switch to</span><select id="gmslot">${seatsOpt}</select></label>
        <button type="button" class="gm-row" data-g="swap">${hooks.swapGet && hooks.swapGet() === uid ? "↩️ Swap back" : "🔄 Swap with me"}</button>
        <button type="button" class="gm-row" data-g="mic">🔇 Mute microphone</button>
        <button type="button" class="gm-row" data-g="cam">🙈 Hide camera</button>
        <button type="button" class="gm-row" data-g="rem">🚪 Remove from seat</button>
        <button type="button" class="gm-row red" data-g="block">⛔ Remove and block</button>
        <div class="gm-msg" id="gmmsg"></div></div>`;
      document.body.appendChild(menu);
      const gm = (t) => { const e = $("#gmmsg", menu); if (e) e.textContent = t; };
      menu.addEventListener("click", async (e) => {
        if (e.target === menu) { closeMenu(); return; }
        const b = e.target.closest("button");
        if (!b) return;
        const g = b.dataset.g;
        if (g === "x") { closeMenu(); return; }
        if (g === "mic" || g === "cam") {
          gm("Working…");
          sb.functions.invoke("livekit-token", { body: { roomName, action: "mute", identity: uid, kind: g } }).then(() => gm(g === "mic" ? "Microphone muted." : "Camera hidden."), () => gm("Could not do that."));
          return;
        }
        if (g === "swap") {
          const on = !(hooks.swapGet && hooks.swapGet() === uid);
          gm("Working…");
          const { error } = await sb.rpc("host_swap", { p_stream: streamId, p_user: on ? uid : null });
          if (error) { gm("Could not swap. Try again."); return; }
          if (hooks.swapSet) hooks.swapSet(on ? uid : null);
          closeMenu(); return;
        }
        if (g === "rem") { if (row) await act("rem", row.id, uid); closeMenu(); return; }
        if (g === "block") {
          if (!confirm("Remove " + (names[uid] || "this guest") + " and stop them joining seats again?")) return;
          try { await sb.rpc("host_block_guest", { p_stream: streamId, p_user: uid }); kick(uid); } catch (err) { /* ignore */ }
          closeMenu(); refresh(); return;
        }
      });
      menu.addEventListener("change", async (e) => {
        if (e.target.id !== "gmslot") return;
        gm("Switching…");
        const { error } = await sb.rpc("host_move_guest", { p_stream: streamId, p_user: uid, p_slot: +e.target.value });
        if (error) { gm("Could not switch. Try again."); return; }
        await refresh(); closeMenu();
      });
    }
    async function saveCfg() {
      try {
        const { error } = await sb.rpc("host_seat_settings", { p_stream: streamId, p_layout: cfg.layout, p_allow: cfg.allow, p_auto: cfg.auto, p_cam: cfg.cam, p_min: cfg.min });
        if (error) throw error;
        if (hooks.onCfg) hooks.onCfg(cfg);
      } catch (e) { say("Could not save the settings. Try again."); }
    }
    box.onclick = async (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      say("");
      if (b.id === "spgear") { view = "settings"; render(); return; }
      if (b.id === "stback") { view = "main"; render(); return; }
      if (b.id === "stall") { view = "layouts"; render(); return; }
      if (b.id === "stback2") { view = "settings"; render(); return; }
      if (b.dataset.auto) { cfg.auto = lastAuto = b.dataset.auto; render(); saveCfg(); return; }
      if (b.dataset.lay) { cfg.layout = b.dataset.lay; if (view === "layouts") view = "settings"; render(); saveCfg(); return; }
      try {
        if (b.id === "spgo") {
          if (open > 0) {
            const accepted = rows.filter((r) => r.status === "accepted");
            const { error } = await sb.rpc("host_set_seats", { p_stream: streamId, p_count: 0 });
            if (error) throw error;
            accepted.forEach((r) => kick(r.user_id));
          } else {
            const { error } = await sb.rpc("host_set_seats", { p_stream: streamId, p_count: +$("#spn", box).value });
            if (error) throw error;
          }
        } else if (b.dataset.act) { await act(b.dataset.act, b.dataset.id, b.dataset.uid); return; }
      } catch (err) { say("Could not do that. Try again."); }
      refresh();
    };
    box.onchange = async (e) => {
      if (e.target && e.target.id === "spn") {
        want = +e.target.value; typing = false;
        if (open > 0) {
          const { error } = await sb.rpc("host_set_seats", { p_stream: streamId, p_count: want });
          if (error) say("Could not change the seats. Try again.");
          refresh();
        }
        return;
      }
      const k = e.target && e.target.dataset && e.target.dataset.k;
      if (!k) return;
      const v = e.target.value;
      if (k === "autoon") { cfg.auto = e.target.checked ? lastAuto : "off"; typing = false; render(); saveCfg(); return; }
      if (k === "cam") cfg.cam = v === "1"; else if (k === "min") cfg.min = +v; else cfg[k] = v;
      typing = false; saveCfg();
    };
    box.onfocusin = (e) => { if (e.target && e.target.tagName === "SELECT") typing = true; };
    box.onfocusout = () => { setTimeout(() => { typing = false; }, 400); };
    refresh();
    try {
      ch = sb.channel("seats-" + streamId + "-" + Math.random().toString(36).slice(2, 7))
        .on("postgres_changes", { event: "*", schema: "public", table: "seat_requests", filter: "stream_id=eq." + streamId }, () => refresh())
        .subscribe();
    } catch (e) { /* polling still works */ }
    poll = setInterval(refresh, 3500);
    return () => {
      stopped = true; closeMenu(); clearInterval(poll); box.onclick = null; box.onchange = null; box.onfocusin = null; box.onfocusout = null;
      try { if (ch) sb.removeChannel(ch); } catch (e) { /* ignore */ }
      box.innerHTML = ""; box.classList.add("hidden");
      if (hooks.onRequests) hooks.onRequests(0, 0);
      if (hooks.onPending) hooks.onPending([], 0);
    };
  }

  /* ---------- host: start a real broadcast ---------- */
  LS.startBroadcast = async function (o) {
    const LK = window.LivekitClient;
    if (!LK) throw new Error("Live video library did not load.");
    if (!sb || !LS.user) throw new Error("Please log in first.");
    const me = LS.user;
    await sb.from("streams").update({ is_live: false }).eq("host_id", me.id).eq("is_live", true);
    const roomName = "ls-" + (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2));
    const { data: row, error } = await sb.from("streams").insert({
      host_id: me.id, title: o.title, category: o.cat, room_name: roomName, is_live: true,
      effect: JSON.stringify(o.fx || {}), viewer_count: 0,
      ...(o.tools ? { watch_who: o.tools.watch, show_about: o.tools.about, blocked_words: o.tools.blocked || "", chat_strict: !!o.tools.strict } : {}), last_seen: new Date().toISOString(),
    }).select().single();
    if (error || !row) throw new Error("Could not start the live (" + ((error && error.message) || "no row") + ").");
    const room = new LK.Room({ adaptiveStream: true, dynacast: true });
    let actx = null, mixDest = null, micNode = null, loopNode = null, loopVol = null;
    const fail = async (e) => { try { await sb.from("streams").update({ is_live: false }).eq("id", row.id); } catch (x) { /* ignore */ } try { room.disconnect(); } catch (x) { /* ignore */ } throw e; };
    try {
      const token = await getToken(roomName, true);
      await wt(room.connect(LS.LK_URL, token), 20000);
      // mix the microphone with the sound of the background video, so viewers hear both
      let audioOut = null;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (o.loopVid && AC) {
        try {
          actx = new AC();
          if (actx.resume) await actx.resume();
          mixDest = actx.createMediaStreamDestination();
          const mics = o.stream.getAudioTracks();
          if (mics.length) { micNode = actx.createMediaStreamSource(new MediaStream(mics)); micNode.connect(mixDest); }
          loopNode = actx.createMediaElementSource(o.loopVid);
          loopVol = actx.createGain(); loopVol.gain.value = 0.8;
          loopNode.connect(loopVol); loopVol.connect(mixDest);
          o.loopVid.muted = false;
          audioOut = mixDest.stream.getAudioTracks()[0] || null;
        } catch (e) { audioOut = null; }
      }
      for (const t of o.stream.getTracks()) {
        if (t.kind === "audio" && audioOut) continue;
        await room.localParticipant.publishTrack(t, t.kind === "video" ? { source: LK.Track.Source.Camera, videoEncoding: LS.videoEncoding(o.tools || LS.TOOLS_DEFAULT) } : { source: LK.Track.Source.Microphone });
      }
      if (audioOut) await room.localParticipant.publishTrack(audioOut, { source: LK.Track.Source.Microphone });
    } catch (e) { await fail(new Error(/timeout/.test(e.message) ? "Connection timed out. Check your internet." : e.message || "Could not connect.")); }

    let fx = Object.assign({}, o.fx);
    const count = () => room.remoteParticipants.size;
    const upd = () => { try { o.onViewers && o.onViewers(count()); } catch (e) { /* ignore */ } };
    const sendFx = () => {
      try { room.localParticipant.publishData(new TextEncoder().encode(JSON.stringify({ t: "fx", layout: fx.layout, loop: fx.loop })), { reliable: true }); } catch (e) { /* ignore */ }
    };
    const gtiles = o.guestsEl ? guestTiles(o.guestsEl) : null;
    const gaudio = document.createElement("div"); gaudio.style.display = "none"; document.body.appendChild(gaudio);
    room.on(LK.RoomEvent.TrackSubscribed, (track, pub, p) => {
      if (track.kind === "video") { if (gtiles) gtiles.add(p.identity, track); }
      else if (track.kind === "audio") { const el = track.attach(); gaudio.appendChild(el); }
    });
    room.on(LK.RoomEvent.TrackUnsubscribed, (track, pub, p) => {
      if (track.kind === "video") { if (gtiles) gtiles.remove(p.identity); }
      else try { track.detach().forEach((e) => e.remove()); } catch (e) { /* ignore */ }
    });
    room.on(LK.RoomEvent.ParticipantConnected, () => { upd(); setTimeout(sendFx, 800); });
    room.on(LK.RoomEvent.ParticipantDisconnected, (p) => { if (gtiles) gtiles.remove(p.identity); upd(); });
    const sw = gtiles && o.stage ? swapper(o.stage, gtiles, true) : null;
    if (sw) sw.setHost(o.stream);

        const media = v.thumb_path ? `<img loading="lazy" alt="" src="${esc(vurl(v.thumb_path))}">` : `<video muted playsinline preload="metadata" src="${esc(vurl(v.video_path))}#t=0.5"></video>`;
        return `<button type="button" class="cg-c" data-vid="${v.id}">${media}<span class="cg-pl">▶</span>${v.caption ? `<div class="cg-cap">${esc(v.caption)}</div>` : ""}<div class="cg-meta"><span class="av">${LS.photo(pr, 22)}</span><span class="nm">${esc(pr.display_name || pr.username || "user")}</span><span>♡ ${fmtN(v.likes_count)}</span></div></button>`;
      }).join("")}</div>`;
      LS.fixThumbs(vids, (v, tp) => {
        const cell = $(`.cg-c[data-vid="${v.id}"]`, scroll);
        const m = cell && cell.firstElementChild;

      });
      scroll.onclick = (e) => {
        const c = e.target.closest("[data-vid]");
        if (!c) return;
        startVid = c.dataset.vid; tab = "fy"; setTabs(); load();
      };
    }

    async function load() {
      scroll.innerHTML = `<div class="fy-empty">Loading…</div>`;
      if (io) io.disconnect();
      if (tab === "com") { await loadCom(); return; }
      const [fset, lives] = await Promise.all([LS.myFollows(), liveRows()]);
      if (dead) return;
      const myId = LS.user && LS.user.id;
      const fl = lives.filter((r) => fset.has(r.host_id) && r.host_id !== myId);
      let vids = [];
      try {
        let qy = sb.from("videos").select("*").order("created_at", { ascending: false }).limit(40);
        if (tab === "fol") qy = fset.size ? qy.in("user_id", Array.from(fset)) : null;
        else if (tab === "friends") {
          let mut = [];
          if (myId) { const { data: fr } = await sb.from("follows").select("follower_id").eq("followee_id", myId); mut = (fr || []).map((r) => r.follower_id).filter((i) => fset.has(i)); }
          qy = mut.length ? qy.in("user_id", mut) : null;
        }
        if (qy) { const { data } = await qy; vids = data || []; }
      } catch (e) { /* ignore */ }
      if (dead) return;
      { const bl = await LS.myBlocks(true); vids = vids.filter((v) => !bl.has(v.user_id)); vids = await LS.filterVideos(vids); }
      let jump = false;
      if (startVid) {
        const at = vids.findIndex((v) => v.id === startVid);
        let one = at >= 0 ? vids.splice(at, 1)[0] : null;
        if (!one) { try { const { data } = await sb.from("videos").select("*").eq("id", startVid).maybeSingle(); one = data; } catch (e) { /* ignore */ } }
        if (one) { vids.unshift(one); jump = true; }
        startVid = null;
      }
      await profs(fl.map((r) => r.host_id).concat(vids.map((v) => v.user_id)));
      let liked = new Set();
      if (myId && vids.length) {
        try { const { data } = await sb.from("video_likes").select("video_id").eq("user_id", myId).in("video_id", vids.map((v) => v.id)); liked = new Set((data || []).map((r) => r.video_id)); } catch (e) { /* ignore */ }
      }
      let saved = new Set();
      if (myId && vids.length) {
        try { const { data } = await sb.from("video_saves").select("video_id").eq("user_id", myId).in("video_id", vids.map((v) => v.id)); saved = new Set((data || []).map((r) => r.video_id)); } catch (e) { /* ignore */ }
      }
      if (dead) return;
      const liveHtml = (tab === "friends" ? [] : fl).map((r) => {
        const h = hueOf(r.host_id), pr = P[r.host_id];
        return `<section class="fy-item fy-live" style="--h:${h}"><div class="fy-lc"><span class="tag">● LIVE NOW</span><br><span class="ring lg" style="--h:${h}">${LS.photo(pr, 92)}</span><h3>${esc(nameOf(r.host_id))} is live</h3><p>${esc(r.title || "Live now")} · 👁 ${fmtN(r.viewer_count)}</p><a class="btn big" href="#/live/${r.id}">🔴 Watch live</a></div></section>`;
      }).join("");
      const vidHtml = vids.map((v, i) => {
        const pr = P[v.user_id], mine = myId === v.user_id, fol = fset.has(v.user_id);
        return `<section class="fy-item" data-i="${i}">
          <video src="${esc(vurl(v.video_path))}" ${v.thumb_path ? `poster="${esc(vurl(v.thumb_path))}"` : ""} loop playsinline muted preload="metadata"></video>
          <div class="fy-side">
            <a class="fy-av" href="#/u/${esc(pr.username || "")}"><span class="ring" style="--h:${hueOf(v.user_id)}">${LS.photo(pr, 48)}</span>${mine || fol ? "" : `<button class="fy-fol" type="button" data-uid="${v.user_id}" aria-label="Follow">+</button>`}</a>
            <button class="fy-like ${liked.has(v.id) ? "on" : ""}" type="button" data-i="${i}" aria-label="Like">♥</button><small class="fy-lc2">${fmtN(v.likes_count)}</small>
            <button class="fy-ic fy-cm" type="button" data-i="${i}" aria-label="Comments"><svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 5.9 2 10.7c0 2.6 1.3 4.9 3.4 6.5L4.5 22l4.6-2.4c.9.2 1.9.3 2.9.3 5.5 0 10-3.9 10-8.7S17.5 2 12 2zm-4 10.2a1.3 1.3 0 110-2.6 1.3 1.3 0 010 2.6zm4 0a1.3 1.3 0 110-2.6 1.3 1.3 0 010 2.6zm4 0a1.3 1.3 0 110-2.6 1.3 1.3 0 010 2.6z"/></svg><small class="fy-cmc">${fmtN(v.comments_count)}</small></button>
            <button class="fy-ic fy-sv ${saved.has(v.id) ? "on" : ""}" type="button" data-i="${i}" aria-label="Save"><svg viewBox="0 0 24 24"><path d="M5 2h14a1 1 0 011 1v19l-8-5-8 5V3a1 1 0 011-1z"/></svg><small class="fy-svc">${fmtN(v.saves_count)}</small></button>
            <button class="fy-ic fy-sh" type="button" data-i="${i}" aria-label="Share"><svg viewBox="0 0 24 24"><path d="M14 3v5C7 8.5 3 12.5 2 20c2.6-3.7 6.2-5.3 12-5.3V20l8-8.5L14 3z"/></svg><small class="fy-shc">${fmtN(v.shares_count)}</small></button>
            ${mine ? "" : `<button class="fy-mr fy-ru" type="button" data-i="${i}" data-ru="1" aria-label="Reuse" style="font-size:22px">🎬</button><button class="fy-mr" type="button" data-i="${i}" aria-label="More">⋯</button>`}
          </div>
          <div class="fy-info"><b>@${esc(pr.username || "user")}</b>${v.caption ? `<p class="fy-cap">${esc(v.caption)}</p>${v.caption.length > 60 ? `<button type="button" class="fy-more" data-more="1">…more</button>` : ""}` : ""}<small style="opacity:.8;display:block;margin-top:4px">👁 ${fmtN(v.views)} views</small></div>
          <div class="fy-disc"><span>${LS.photo(pr, 30)}</span></div>
        </section>`;
      }).join("");
      if (!liveHtml && !vidHtml) {
        scroll.innerHTML = `<div class="fy-empty"><div>${tab === "fol" ? (fset.size ? "People you follow have not posted yet." : "Follow people to see their videos and lives here.") : tab === "friends" ? "Friends are people who follow each other. Their videos show here." : "No videos yet."}<br><br>${LS.user ? `<a class="btn" href="#/upload-video">⬆️ Upload a video</a>` : `<a class="btn" href="#/auth">Log in</a>`}</div></div>`;
        return;
      }
      scroll.innerHTML = liveHtml + vidHtml + (vids.length ? "" : "");
      if (!soundOn) { const hint = document.createElement("div"); hint.className = "fy-hint"; hint.textContent = "🔇 Tap anywhere for sound"; $(".fyp", view).appendChild(hint);
      setTimeout(() => hint.remove(), 5000); }
      if (jump) { const f = $('.fy-item[data-i="0"]', scroll); if (f) f.scrollIntoView(); }
      const items = $$(".fy-item[data-i]", scroll);
      io = new IntersectionObserver((ents) => {
        ents.forEach((en) => {
          const vd = $("video", en.target);
          if (!vd) return;
          if (en.isIntersecting && en.intersectionRatio >= 0.7) {
            vd.muted = !soundOn;
            playSafe(vd);
            const v = vids[+en.target.dataset.i];
            if (v && !viewed.has(v.id)) { viewed.add(v.id); setTimeout(() => { if (!vd.paused) sb.rpc("add_view", { p_video: v.id }).then(() => {}, () => {}); }, 2000); }
          } else vd.pause();
        });
      }, { root: scroll, threshold: [0, 0.7, 1] });
      items.forEach((it) => io.observe(it));
      let lastTap = { it: null, t: 0, timer: 0 };
      const pop = (it, x, y) => {
        const h = document.createElement("span"); h.className = "fy-pop"; h.textContent = "♥";
        h.style.left = x + "px"; h.style.top = y + "px"; it.appendChild(h);
        setTimeout(() => h.remove(), 850);
      };
      async function toggleLike(lk, forceOn) {
        if (!LS.user) { location.hash = "#/auth"; return; }
        if (lk.disabled) return;
        const v = vids[+lk.dataset.i], on = forceOn == null ? !lk.classList.contains("on") : forceOn;
        lk.disabled = true;
        const { data, error } = await sb.rpc("like_video", { p_video: v.id, p_on: on });
        lk.disabled = false;
        if (error) return;
        lk.classList.toggle("on", on);
        const c = lk.nextElementSibling; if (c) c.textContent = fmtN(Number(data) || 0);
      }
      scroll.onclick = async (e) => {
        const f = e.target.closest(".fy-fol");
        if (f) { e.preventDefault(); e.stopPropagation(); f.disabled = true; const fr = await LS.setFollow(f.dataset.uid, true); if (fr === true) f.remove(); else if (fr === "requested") { f.textContent = "Requested"; } else f.disabled = false; return; }
        const lk = e.target.closest(".fy-like");
        if (lk) { toggleLike(lk, null); return; }
        const mo = e.target.closest("[data-more]");
        if (mo) { const c = $(".fy-cap", mo.parentNode); if (c) { const o = c.classList.toggle("open"); mo.textContent = o ? " less" : "…more"; } return; }
        const cmb = e.target.closest(".fy-cm");
        if (cmb) { openComments(vids[+cmb.dataset.i], $(".fy-cmc", cmb)); return; }
        const svb = e.target.closest(".fy-sv");
        if (svb) {
          if (!LS.user) { location.hash = "#/auth"; return; }
          if (svb.disabled) return;
          const v = vids[+svb.dataset.i], on = !svb.classList.contains("on");
          svb.disabled = true;
          const { data, error } = await sb.rpc("save_video", { p_video: v.id, p_on: on });
          svb.disabled = false;
          if (error) return;
          svb.classList.toggle("on", on); $(".fy-svc", svb).textContent = fmtN(Number(data) || 0);
          return;
        }
        const rub = e.target.closest(".fy-ru");
        if (rub) { const v = vids[+rub.dataset.i], pr = P[v.user_id] || {}; LS.startReuse(v, pr.username); return; }
        const mrb = e.target.closest(".fy-mr");
        if (mrb) { const v = vids[+mrb.dataset.i], pr = P[v.user_id] || {}; LS.reportSheet({ uid: v.user_id, uname: pr.username, vid: v.id, done: (k) => { if (k === "block") load(); } }); return; }
        const shb = e.target.closest(".fy-sh");
        if (shb) {
          const v = vids[+shb.dataset.i], pr = P[v.user_id] || {};
          const url = location.origin + "/#/u/" + (pr.username || "");
          const text = (v.caption || "Watch this video") + " — @" + (pr.username || "user");
          let done = false;
          try { if (navigator.share) { await navigator.share({ title: "LiveStream Studio", text, url }); done = true; } } catch (x) { /* cancelled */ }
          if (!done) { try { await navigator.clipboard.writeText(url); const h = document.createElement("div"); h.className = "fy-hint"; h.textContent = "🔗 Link copied"; $(".fyp", view).appendChild(h); setTimeout(() => h.remove(), 2000); done = true; } catch (x) { /* ignore */ } }
          if (done) { const { data } = await sb.rpc("share_video", { p_video: v.id }); if (data != null) $(".fy-shc", shb).textContent = fmtN(Number(data) || 0); }
          return;
        }
        const it = e.target.closest(".fy-item[data-i]");
        if (it && !e.target.closest("a,button")) {
          const now = Date.now();
          if (lastTap.it === it && now - lastTap.t < 320) {
            // double tap = like
            clearTimeout(lastTap.timer); lastTap = { it: null, t: 0, timer: 0 };
            const r = it.getBoundingClientRect();
            pop(it, e.clientX - r.left, e.clientY - r.top);
            const btn = $(".fy-like", it);
            if (btn && !btn.classList.contains("on")) toggleLike(btn, true);
            return;
          }
          clearTimeout(lastTap.timer);
          lastTap = { it, t: now, timer: setTimeout(() => {
            const vd = $("video", it);
            if (!vd) return;
            if (!soundOn) { soundOn = true; $$("video", scroll).forEach((x) => { x.muted = false; }); const h = $(".fy-hint", view); if (h) h.remove(); }
            else if (vd.paused) vd.play().catch(() => {}); else vd.pause();
          }, 330) };
        }
      };
    }

    $(".fy-top", view).addEventListener("click", (e) => {
      if (e.target.closest("[data-live]")) { openLives(); return; }
      const b = e.target.closest("[data-t]");
      if (!b || b.dataset.t === tab) return;
      tab = b.dataset.t; try { LS.store && LS.store.set("fyTab", tab); } catch (x) { /* ignore */ }
      setTabs(); load();
    });
    setTabs(); load(); bell();
    return () => { dead = true; ["pointerup", "click", "touchend", "keydown"].forEach((ev) => window.removeEventListener(ev, onAct, true)); if (io) io.disconnect(); $$("video", scroll).forEach((x) => { try { x.pause(); x.removeAttribute("src"); x.load(); } catch (e) { /* ignore */ } }); };
  };

  S.friends = function (view) { return S.home(view, "friends"); };

  /* ---------- live alerts: someone you follow goes live ---------- */
  const seen = new Set();
  try { JSON.parse(localStorage.getItem("ls.alertSeen") || "[]").forEach((i) => seen.add(i)); } catch (e) { /* ignore */ }
  const saveSeen = () => { try { localStorage.setItem("ls.alertSeen", JSON.stringify(Array.from(seen).slice(-60))); } catch (e) { /* ignore */ } };
  let log = [];
  try { log = JSON.parse(localStorage.getItem("ls.alertLog") || "[]"); } catch (e) { log = []; }
  const ago = (t) => { const m = Math.max(0, Math.round((Date.now() - t) / 60000)); return m < 1 ? "now" : m < 60 ? m + "m" : m < 1440 ? Math.round(m / 60) + "h" : Math.round(m / 1440) + "d"; };
  function syncActivity() {
    if (!LS.ACTIVITY) return;
    LS.ACTIVITY = log.slice(0, 20).map((a) => ({ icon: "🔴", text: a.text, time: ago(a.t), id: a.id })).concat(LS.ACTIVITY.filter((a) => !a.id));
  }
  syncActivity();
  let queue = [], showing = false;
  function banner(a) {
    queue.push(a);
    if (showing) return;
    showing = true;
    (function next() {
      const x = queue.shift();
      if (!x) { showing = false; return; }
      const el = document.createElement("a");
      el.className = "lv-banner"; el.href = "#/live/" + x.id;
      el.innerHTML = `<span style="font-size:22px">🔴</span><div>${esc(x.name)} is live now<small>${esc(x.title)}</small></div>`;
      el.addEventListener("click", () => el.remove());
      document.body.appendChild(el);
      setTimeout(() => { el.remove(); next(); }, 7000);
    })();
  }
  let busy = false;
  async function check() {
    if (busy || !sb || !LS.user) return;
    busy = true;
    try {
      { const ss = LS.getSettings ? await LS.getSettings() : null; if (ss && ss.notif_live === false) return; }
      const fset = await LS.myFollows();
      if (!fset.size) return;
      const rows = (await liveRows()).filter((r) => fset.has(r.host_id) && r.host_id !== LS.user.id && !seen.has(r.id));
      if (!rows.length) return;
      await profs(rows.map((r) => r.host_id));
      rows.forEach((r) => {
        seen.add(r.id);
        if (location.hash.indexOf(r.id) >= 0) return;
        const nm = nameOf(r.host_id), title = r.title || "Live now";
        log.unshift({ t: Date.now(), id: r.id, text: nm + " is live: " + title });
        banner({ id: r.id, name: nm, title });
        try { if ("Notification" in window && Notification.permission === "granted") { const n = new Notification(nm + " is live now", { body: title, tag: r.id }); n.onclick = () => { window.focus(); location.hash = "#/live/" + r.id; n.close(); }; } } catch (e) { /* ignore */ }
      });
      log = log.slice(0, 30);
      try { localStorage.setItem("ls.alertLog", JSON.stringify(log)); } catch (e) { /* ignore */ }
      saveSeen(); syncActivity();
    } catch (e) { /* ignore */ } finally { busy = false; }
  }
  if (sb) {
    setTimeout(check, 3500);
    setInterval(check, 15000);
    try { sb.channel("live-alerts-" + Math.random().toString(36).slice(2, 7)).on("postgres_changes", { event: "*", schema: "public", table: "streams" }, () => setTimeout(check, 800)).subscribe(); } catch (e) { /* polling still works */ }
  }
})();

  <script>
/* Report and Block. */
(function () {
  const LS = window.LS;
  const sb = LS.sb;
  const esc = LS.esc;
  const st = document.createElement("style");
  st.textContent = `
  .rb-ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:flex-end}
  .rb-sh{width:100%;max-width:520px;margin:0 auto;background:#1b1b22;color:#fff;border-radius:18px 18px 0 0;padding:10px 0 18px}
  .rb-sh h4{margin:8px 16px 6px;font-size:15px;opacity:.7;font-weight:600}
  .rb-sh button{display:block;width:100%;text-align:left;background:none;border:0;color:#fff;font-size:16px;padding:14px 18px}
  .rb-sh button.red{color:#ff4d6a}
  .rb-sh button.cx{text-align:center;opacity:.7;border-top:1px solid #ffffff18;margin-top:6px}
  .rb-toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:20px;z-index:210;font-size:14px}
  .fy-mr{background:none;border:0;color:#fff;font-size:26px;line-height:1;padding:0;width:44px;height:30px;text-shadow:0 1px 3px #000}
  `;
  document.head.appendChild(st);

  let cache = null;
  LS.myBlocks = async function (force) {
    if (!LS.user || !sb) return new Set();
    if (cache && !force) return cache;
    try {
      const { data } = await sb.from("user_blocks").select("blocked_id").eq("blocker_id", LS.user.id);
      cache = new Set((data || []).map((r) => r.blocked_id));
    } catch (e) { cache = new Set(); }
    return cache;
  };
  function toast(t) { const d = document.createElement("div"); d.className = "rb-toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }

  /* opts: { uid, uname, vid, done(kind) } */
  LS.reportSheet = async function (o) {
    if (!LS.user) { location.hash = "#/auth"; return; }
    if (LS.user.id === o.uid) return;
    const blocked = (await LS.myBlocks()).has(o.uid);
    const ov = document.createElement("div");
    ov.className = "rb-ov";
    const close = () => ov.remove();
    const show = (html) => { ov.innerHTML = `<div class="rb-sh">${html}<button class="cx" data-x="1">Cancel</button></div>`; };
    ov.addEventListener("click", (e) => { if (e.target === ov || e.target.closest("[data-x]")) close(); });
    const main = () => {
      show(`${o.vid ? `<button data-a="rv">🚩 Report video</button>` : ""}<button data-a="ru">🚩 Report @${esc(o.uname || "user")}</button><button class="red" data-a="bl">${blocked ? "✅ Unblock" : "🚫 Block"} @${esc(o.uname || "user")}</button>`);
    };
    const REASONS = ["Spam or scam", "Nudity or sexual content", "Violence or dangerous acts", "Harassment or hate", "Under 18 / child safety", "Something else"];
    const reasons = (kind) => { show(`<h4>Why are you reporting this?</h4>${REASONS.map((r, i) => `<button data-r="${i}">${r}</button>`).join("")}`); ov.dataset.kind = kind; };
    ov.addEventListener("click", async (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      if (b.dataset.a === "rv") return reasons("video");
      if (b.dataset.a === "ru") return reasons("user");
      if (b.dataset.a === "bl") {
        b.disabled = true;
        let ok = false;
        if (blocked) { const r = await sb.from("user_blocks").delete().eq("blocker_id", LS.user.id).eq("blocked_id", o.uid); ok = !r.error; }
        else { const r = await sb.from("user_blocks").insert({ blocker_id: LS.user.id, blocked_id: o.uid }); ok = !r.error; }
        if (!ok) { b.disabled = false; toast("Could not do that. Try again."); return; }
        await LS.myBlocks(true);
        close(); toast(blocked ? "Unblocked" : "Blocked. Their videos are hidden from you.");
        if (o.done) o.done(blocked ? "unblock" : "block");
        return;
      }
      if (b.dataset.r != null) {
        const kind = ov.dataset.kind, reason = REASONS[+b.dataset.r];
        b.disabled = true;
        const row = kind === "video" ? { reporter_id: LS.user.id, kind, target_id: o.vid, target_user: o.uid, reason } : { reporter_id: LS.user.id, kind, target_id: o.uid, target_user: o.uid, reason };
        const r = await sb.from("reports").insert(row);
        close(); toast(r.error ? "Could not send the report." : "Thanks. We will review it.");
      }
    });
    main();
    document.body.appendChild(ov);
  };
})();
</script>

  .of-opt.on i:after{content:"";position:absolute;inset:6px;border-radius:50%;background:#fff}

  `;
  document.head.appendChild(st);

  const getList = () => { try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { return []; } };

  const vurl = (p) => (sb && p ? sb.storage.from("videos").getPublicUrl(p).data.publicUrl : "");
  const OPTS = [

  LS.offlineSheet = function () {

      ov.innerHTML = `<div class="of-sh"><h3>Offline videos<button id="ofx" aria-label="Close">✕</button></h3>

        <button class="of-go" id="ofgo">Download</button>
        ${saved.length ? `<button class="of-go alt" id="ofw">▶ Watch offline (${saved.length} · ${mb(total)})</button><button class="of-go alt" id="ofr" style="color:#ff4d6a">Remove downloads</button>` : ""}</div>`;
      $("#ofx", ov).addEventListener("click", close);
      ov.querySelectorAll(".of-opt").forEach((b) => b.addEventListener("click", () => { pick = b.dataset.k; main(); }));
      $("#ofgo", ov).addEventListener("click", download);
      const w = $("#ofw", ov); if (w) w.addEventListener("click", () => list());
      const r = $("#ofr", ov); if (r) r.addEventListener("click", async () => { if (!confirm("Remove all downloaded videos?")) return; try { await caches.delete(CACHE); } catch (e) { /* ignore */ } setList([]); main(); });
    }
    async function download() {
      const o = OPTS.find((x) => x.k === pick);
      busy = true; cancel = false;
      ov.innerHTML = `<div class="of-sh"><h3>Downloading…</h3><div class="of-bar"><i id="ofp"></i></div><p id="oft" style="text-align:center">Getting the list…</p><button class="of-go alt" id="ofc">Cancel</button></div>`;
      $("#ofc", ov).addEventListener("click", () => { cancel = true; });
      let vids = [];
      try {
        const bl = await LS.myBlocks();
        const { data } = await sb.from("videos").select("id,user_id,video_path,thumb_path,caption,created_at").order("created_at", { ascending: false }).limit(o.n);
        vids = (data || []).filter((v) => !bl.has(v.user_id));
      } catch (e) { /* ignore */ }
      if (!vids.length) { busy = false; ov.innerHTML = `<div class="of-sh"><h3>Offline videos</h3><p style="text-align:center">There are no videos to download yet.</p><button class="of-go" id="ofok">OK</button></div>`; $("#ofok", ov).addEventListener("click", main); return; }
      const c = await caches.open(CACHE), have = new Map(getList().map((x) => [x.id, x]));

      for (const v of vids) {
        if (cancel) break;
        $("#oft", ov).textContent = `Downloading ${done + 1} of ${vids.length}…`;
        if (!have.has(v.id)) {
          try {
            const r = await fetch(vurl(v.video_path));
            if (!r.ok) throw new Error("bad");
            const blob = await r.clone().blob();
            if (total + blob.size > o.bytes) { $("#oft", ov).textContent = "Storage limit reached."; break; }
            await c.put(vurl(v.video_path), r);
            if (v.thumb_path) { try { const t = await fetch(vurl(v.thumb_path)); if (t.ok) await c.put(vurl(v.thumb_path), t); } catch (e) { /* ignore */ } }
            total += blob.size;

            setList(Array.from(have.values()));
          } catch (e) { failed++; if (e && e.name === "QuotaExceededError") { $("#oft", ov).textContent = "Your phone is out of space."; break; } }
        }
        done++;
        $("#ofp", ov).style.width = Math.round((done / vids.length) * 100) + "%";
      }
      busy = false;
      const n = getList().length;
      ov.innerHTML = `<div class="of-sh"><h3>${cancel ? "Stopped" : "Done"}</h3><p style="text-align:center">${n} video${n === 1 ? "" : "s"} saved on this phone (${mb(getList().reduce((s, x) => s + (x.bytes || 0), 0))})${failed ? `<br>${failed} could not be downloaded.` : ""}</p><button class="of-go" id="ofok">OK</button></div>`;
      $("#ofok", ov).addEventListener("click", main);
    }
    async function list() {
      const items = getList();
      const c = await caches.open(CACHE);
      const thumbs = await Promise.all(items.map(async (x) => { if (!x.thumb) return ""; try { const r = await c.match(vurl(x.thumb)); return r ? URL.createObjectURL(await r.blob()) : ""; } catch (e) { return ""; } }));
      ov.innerHTML = `<div class="of-sh"><h3>Saved videos<button id="ofx" aria-label="Back">←</button></h3><div class="vgrid">${items.map((x, i) => `<button class="vcell" data-i="${i}" type="button">${thumbs[i] ? `<img src="${thumbs[i]}" alt="">` : `<span style="position:static;color:#fff;display:grid;place-items:center;height:100%">▶</span>`}</button>`).join("")}</div></div>`;
      $("#ofx", ov).addEventListener("click", main);
      $(".vgrid", ov).addEventListener("click", async (e) => {
        const b = e.target.closest(".vcell"); if (!b) return;
        const x = items[+b.dataset.i];
        const r = await c.match(vurl(x.path));

      });
    }
    main();
    document.body.appendChild(ov);
  };
})();

  <script>
/* Tiny hash router. */
(function () {
  const LS = window.LS;
  const S = LS.screens;
  const view = document.getElementById("view");

  const routes = [
    [/^\/$/, S.home, "home"],
    [/^\/discover$/, S.discover, "discover"],
    [/^\/friends$/, (v) => S.friends(v), "friends"],
    [/^\/live$/, S.liveList, "home"],
    [/^\/live\/([\w-]+)$/, S.room, "room"],
    [/^\/golive$/, S.goLive, "golive"],
    [/^\/inbox$/, S.inbox, "inbox"],
    [/^\/inbox\/([\w-]+)$/, S.thread, "thread"],
    [/^\/chat\/([\w]+)$/, S.chat, "thread"],
    [/^\/following\/([^\/]+)$/, S.userFollowing, "thread"],
    [/^\/liked$/, S.liked, "thread"],
    [/^\/liked\/([^\/]+)$/, S.liked, "thread"],
    [/^\/profile$/, S.profile, "profile"],
    [/^\/settings$/, S.settings, "thread"],
    [/^\/blocked$/, S.blocked, "thread"],
    [/^\/studio$/, S.studio, "thread"],
    [/^\/qr$/, S.qr, "thread"],
    [/^\/activity$/, S.activity, "thread"],
    [/^\/history\/(watch|comments|search|ads|mentions|account|reuse)$/, S.history, "thread"],
    [/^\/live-analytics$/, S.liveAnalytics, "thread"],
    [/^\/auth$/, S.auth, "profile"],
    [/^\/edit-profile$/, S.editProfile, "thread"],
    [/^\/recharge$/, S.recharge, "thread"],
    [/^\/earnings$/, S.earnings, "thread"],
    [/^\/upload-video$/, S.uploadVideo, "thread"],
    [/^\/follows\/(followers|following)$/, S.follows, "profile"],
    [/^\/u\/([\w]+)$/, S.userProfile, "profile"],
  ];

  let cleanup = null;

  function render() {
    if (cleanup) { try { cleanup(); } catch (e) { /* ignore */ } cleanup = null; }
    const path = location.hash.slice(1) || "/";
    for (const [re, fn, tab] of routes) {
      const m = path.match(re);
      if (!m) continue;
      view.innerHTML = "";
      document.body.classList.toggle("immersive", tab === "room" || tab === "thread" || tab === "golive");
      LS.$$("#tabbar a").forEach((a) => a.classList.toggle("on", a.dataset.tab === tab));
      view.scrollTop = 0;
      cleanup = fn(view, ...m.slice(1)) || null;
      return;
    }
    location.hash = "#/";
  }

  window.addEventListener("hashchange", render);
  render();
})();

</script>
